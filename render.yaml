databases:
  - name: frontdesk-db
    plan: free
    databaseName: frontdesk
services:
  - type: web
    name: frontdesk
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: frontdesk-db, property: connectionString }
      - key: PGSSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: SEED_PASSWORD
        value: frontdesk123
